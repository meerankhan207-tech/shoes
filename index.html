<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShoeZone | Buy Shoes Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">Shoe<span>Zone</span></div>

    <nav>
      <a href="#home">Home</a>
      <a href="#products">Shoes</a>
      <a href="#contact">Contact</a>
    </nav>

    <button class="cart-btn">
      Cart <span id="cart-count">0</span>
    </button>
  </header>

  <section class="hero" id="home">
    <div class="hero-text">
      <h1>Step Into Style</h1>
      <p>Find comfortable, stylish and affordable shoes for every occasion.</p>
      <a href="#products" class="btn">Shop Now</a>
    </div>
  </section>

  <section class="products" id="products">
    <h2>Popular Shoes</h2>

    <div class="product-grid">

      <div class="card">
        <div class="shoe-img">👟</div>
        <h3>Running Shoes</h3>
        <p>Rs. 4,999</p>
        <button class="add-cart">Add to Cart</button>
      </div>

      <div class="card">
        <div class="shoe-img">👟</div>
        <h3>Sports Shoes</h3>
        <p>Rs. 6,499</p>
        <button class="add-cart">Add to Cart</button>
      </div>

      <div class="card">
        <div class="shoe-img">👟</div>
        <h3>Casual Shoes</h3>
        <p>Rs. 3,499</p>
        <button class="add-cart">Add to Cart</button>
      </div>

    </div>
  </section>

  <footer id="contact">
    <p>© 2026 ShoeZone. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
